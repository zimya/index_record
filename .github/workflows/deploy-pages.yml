name: Deploy Cloudflare Pages

on:
    workflow_run:
        workflows: ["Build & Release"]
        types:
            - completed

permissions:
    contents: read
    actions: read

jobs:
    deploy:
        if: ${{ github.event.workflow_run.conclusion == 'success' }}
        runs-on: ubuntu-latest

        steps:
            - name: Download version.json artifact
              uses: actions/download-artifact@v4
              with:
                  name: version-json
                  path: pages-dist
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  run-id: ${{ github.event.workflow_run.id }}

            - name: Deploy version.json to Cloudflare Pages
              if: ${{ env.HAVE_CF_TOKEN == 'true' && env.HAVE_CF_ACCOUNT == 'true' }}
              env:
                  HAVE_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
                  HAVE_CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
              uses: cloudflare/wrangler-action@v3
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  command: pages deploy pages-dist --project-name=indexrecord
