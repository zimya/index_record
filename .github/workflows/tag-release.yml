name: Build & Release

on:
    push:
        tags:
            - "v*"
            - "[0-9]+.*"
    workflow_dispatch:
        inputs:
            tag_name:
                description: "Release Tag name (e.g. v0.1.0)"
                required: true
                default: "v0.1.0"

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup JDK 17
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "21"
                  cache: gradle

            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v4

            - name: Grant execute permission for gradlew
              run: chmod +x ./gradlew

            - name: Decode Release Keystore
              env:
                  SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
                  SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
                  SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
                  SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
              run: |
                  for var in SIGNING_KEYSTORE_BASE64 SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
                    if [ -z "${!var}" ]; then
                      echo "::error::Missing required secret: $var"
                      exit 1
                    fi
                  done
                  echo "$SIGNING_KEYSTORE_BASE64" | tr -d '\n\r ' | base64 -d > "${{ runner.temp }}/release.jks"
                  echo "SIGNING_KEYSTORE_PATH=${{ runner.temp }}/release.jks" >> "$GITHUB_ENV"

            - name: Build Release APK
              env:
                  SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
                  SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
                  SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
              run: ./gradlew :app:assembleRelease --stacktrace

            - name: Prepare Release Assets
              id: prepare
              run: |
                  TAG="${{ github.event.inputs.tag_name }}"
                  if [ -z "$TAG" ]; then
                    TAG="${GITHUB_REF_NAME}"
                  fi

                  VERSION_CODE=$(jq -r '.elements[0].versionCode // empty' app/build/outputs/apk/release/output-metadata.json 2>/dev/null)
                  VERSION_NAME=$(jq -r '.elements[0].versionName // empty' app/build/outputs/apk/release/output-metadata.json 2>/dev/null)

                  if [ -z "$VERSION_CODE" ]; then
                    VERSION_CODE=$(git rev-list --count HEAD)
                  fi
                  if [ -z "$VERSION_NAME" ]; then
                    VERSION_NAME="${TAG#v}"
                  fi

                  XPOSED_TAG="${VERSION_CODE}-${VERSION_NAME}"

                  mkdir -p release-assets
                  for apk in app/build/outputs/apk/release/*.apk; do
                    [ -f "$apk" ] || continue
                    base=$(basename "$apk" .apk)
                    name="${base#app-}"
                    cp "$apk" "release-assets/index-record-${TAG}-${name}.apk"
                  done

                  echo "tag=$TAG" >> $GITHUB_OUTPUT
                  echo "xposed_tag=$XPOSED_TAG" >> $GITHUB_OUTPUT
                  echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
                  echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT

            - name: Create GitHub Release and Upload APKs
              id: create_release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ steps.prepare.outputs.tag }}
                  name: "Release ${{ steps.prepare.outputs.tag }}"
                  generate_release_notes: true
                  files: release-assets/*.apk

            - name: Fetch Release Notes from Main Repo
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                       -H "Accept: application/vnd.github+json" \
                       "https://api.github.com/repos/${{ github.repository }}/releases/${{ steps.create_release.outputs.id }}" \
                       | jq -r '.body // empty' > release-notes.md

                  if [ ! -s release-notes.md ]; then
                    echo "See changelog at: https://github.com/${{ github.repository }}/releases/tag/${{ steps.prepare.outputs.tag }}" > release-notes.md
                  fi

            - name: Generate version.json for Cloudflare Pages
              run: |
                  TAG="${{ steps.prepare.outputs.tag }}"
                  rm -f changelog.txt
                  if [ "$(git cat-file -t "refs/tags/${TAG}" 2>/dev/null)" = "tag" ]; then
                    git tag -l --format='%(contents)' "$TAG" \
                      | sed '/-----BEGIN PGP SIGNATURE-----/,$d' > changelog.txt
                  fi
                  if [ ! -s changelog.txt ] || [ -z "$(tr -d '[:space:]' < changelog.txt)" ]; then
                    cp release-notes.md changelog.txt
                  fi

                  mkdir -p pages-dist
                  ASSETS_JSON=$(
                    for apk in release-assets/*.apk; do
                      [ -f "$apk" ] || continue
                      basename "$apk"
                    done | jq -R . | jq -s .
                  )
                  jq -n \
                    --arg versionName "${{ steps.prepare.outputs.version_name }}" \
                    --argjson versionCode "${{ steps.prepare.outputs.version_code }}" \
                    --arg tag "$TAG" \
                    --arg xposedTag "${{ steps.prepare.outputs.xposed_tag }}" \
                    --arg downloadBaseUrl "https://github.com/Xposed-Modules-Repo/com.melonhu.indexrecord/releases/download/${{ steps.prepare.outputs.xposed_tag }}" \
                    --argjson assets "$ASSETS_JSON" \
                    --rawfile changelog changelog.txt \
                    '{
                      versionName: $versionName,
                      versionCode: $versionCode,
                      tag: $tag,
                      xposedTag: $xposedTag,
                      changelog: ($changelog | gsub("^\\s+|\\s+$"; "")),
                      downloadBaseUrl: $downloadBaseUrl,
                      assets: $assets
                    }' > pages-dist/version.json

            - name: Upload version.json artifact
              uses: actions/upload-artifact@v4
              with:
                  name: version-json
                  path: pages-dist/version.json
                  if-no-files-found: error

            - name: Push Release to Xposed-Modules-Repo
              if: ${{ env.HAVE_TOKEN == 'true' }}
              env:
                  HAVE_TOKEN: ${{ secrets.XPOSED_REPO_TOKEN != '' }}
              uses: softprops/action-gh-release@v2
              with:
                  token: ${{ secrets.XPOSED_REPO_TOKEN }}
                  repository: Xposed-Modules-Repo/com.melonhu.indexrecord
                  tag_name: ${{ steps.prepare.outputs.xposed_tag }}
                  name: "Release ${{ steps.prepare.outputs.xposed_tag }}"
                  body_path: release-notes.md
                  generate_release_notes: false
                  files: release-assets/*.apk
