name: Build & Release

on:
  push:
    tags:
      - "v*"
      - "[0-9]+.*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release Tag name (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Debug and Release
        run: ./gradlew :app:assembleRelease :app:assembleDebug --stacktrace

      - name: Prepare Release Assets
        id: prepare
        run: |
          TAG="${{ github.event.inputs.tag_name }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          mkdir -p release-assets
          cp app/build/outputs/apk/release/*.apk release-assets/index-record-${TAG}-release.apk
          cp app/build/outputs/apk/debug/*.apk release-assets/index-record-${TAG}-debug.apk
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create GitHub Release and Upload APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare.outputs.tag }}
          name: "Release ${{ steps.prepare.outputs.tag }}"
          generate_release_notes: true
          files: release-assets/*.apk
